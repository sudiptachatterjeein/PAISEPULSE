<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d38"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="icon" href="/icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Paisa Pulse</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef3f1;--cd:#fff;--tx:#0d1f1c;--mu:#62766f;--pr:#0f766e;--p2:#14b8a6;--ac:#f59e0b;--ok:#16a34a;--bad:#e11d48;--bd:#dce6e2;--sh:0 8px 24px rgba(15,60,55,.08)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#081210;--cd:#112220;--tx:#e8f3f0;--mu:#8ba69f;--pr:#2dd4bf;--p2:#0f766e;--ok:#4ade80;--bad:#fb7185;--bd:#1f3733;--sh:0 8px 24px rgba(0,0,0,.4)}}
:root[data-theme=dark]{--bg:#081210;--cd:#112220;--tx:#e8f3f0;--mu:#8ba69f;--pr:#2dd4bf;--p2:#0f766e;--ok:#4ade80;--bad:#fb7185;--bd:#1f3733;--sh:0 8px 24px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:780px;margin:0 auto;padding:12px 14px 110px}
h1,h2,h3{margin:0}h3{font-size:15px}.mu{color:var(--mu);font-size:12.5px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:15px;margin:12px 0;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,#0b3d38,#0f766e 55%,#14b8a6);color:#fff;border-radius:24px;padding:20px;margin:12px 0;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero h1{font-size:34px;letter-spacing:-1px}.hero .mu{color:rgba(255,255,255,.75)}
.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sb{justify-content:space-between}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{background:rgba(255,255,255,.14);border-radius:14px;padding:9px 11px}.k b{display:block;font-size:16px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px;min-width:0}
input,select{flex:1 1 130px}
button{cursor:pointer;background:linear-gradient(135deg,var(--pr),var(--p2));color:#fff;border:0;font-weight:600}button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button.x{padding:5px 9px;font-size:12px}
.in{color:var(--ok)}.out{color:var(--bad)}
.bar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--p2),var(--pr))}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(94%,520px);background:var(--cd);border:1px solid var(--bd);border-radius:24px;display:flex;justify-content:space-around;padding:6px;box-shadow:var(--sh);z-index:5}
nav button{background:none;color:var(--mu);font-size:10.5px;padding:6px 10px;border-radius:16px}nav button.on{background:var(--pr);color:#fff}nav i{display:block;font-style:normal;font-size:18px}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:28px;z-index:6;box-shadow:0 8px 20px rgba(15,118,110,.45);padding:0}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--cd);width:min(100%,560px);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:10px}.seg button{flex:1;background:none;color:var(--mu)}.seg button.on{background:var(--cd);color:var(--tx);box-shadow:var(--sh)}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.ic{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:19px;flex:none}.fl{flex:1;min-width:0}.fl div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars span{display:block;border-radius:6px 6px 0 0;background:linear-gradient(var(--p2),var(--pr));min-height:3px}
.dn{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;flex:none}.dn div{width:78px;height:78px;border-radius:50%;background:var(--cd);display:grid;place-items:center;text-align:center;font-size:11px;color:var(--mu)}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;flex:none}.ring div{width:64px;height:64px;border-radius:50%;background:var(--cd);display:grid;place-items:center;font-weight:700;font-size:20px}
.login{min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.chip{display:inline-block;background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:4px 10px;font-size:12px;margin:3px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;z-index:20;font-size:13px}
footer{text-align:center;color:var(--mu);font-size:12px;margin:16px 0}pre{white-space:pre-wrap;font:inherit;margin:8px 0 0}

.sp{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 38%,#0f766e,#052e2b 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;transition:opacity .6s,visibility .6s}
.sp.hd{opacity:0;visibility:hidden}
.sp .lo{animation:pop .9s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 12px 28px rgba(20,184,166,.5))}
.sp .ring2{position:absolute;width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,255,255,.35);animation:rp 2s ease-out infinite;top:calc(50% - 130px);left:calc(50% - 75px)}
.sp h1{font-size:34px;letter-spacing:-1px;animation:up .8s .5s both}.sp p{margin:0;opacity:.8;animation:up .8s .8s both}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dw 1.1s .5s forwards}.pt{opacity:0;animation:up .4s 1.5s forwards}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes dw{to{stroke-dashoffset:0}}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rp{from{transform:scale(.7);opacity:.8}to{transform:scale(1.8);opacity:0}}
@media(prefers-reduced-motion:reduce){.sp *,.dr,.pt{animation:none!important;stroke-dashoffset:0;opacity:1}}
.snap{background:var(--bg);border-radius:14px;padding:10px 12px;margin-top:8px}
nav button{padding:6px 6px;font-size:10px}.pl{background:var(--bg);border-radius:14px;padding:10px 12px;margin-top:8px}
.tw{overflow-x:auto}table{border-collapse:collapse}td,th{padding:5px 6px;text-align:left;white-space:nowrap}summary{cursor:pointer;margin-top:6px}
</style></head><body><div class="w" id="app"></div><div id="md"></div><div class="sp" id="sp"><div class="ring2"></div><div class="lo">${SPL}</div><h1>Paisa Pulse</h1><p>Track every rupee · Grow every goal</p></div>
<script>
const LG=(n,d)=>`<svg viewBox="0 0 64 64" width="${n}" height="${n}" aria-label="Paisa Pulse logo"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#064e46"/></linearGradient></defs><rect width="64" height="64" rx="19" fill="url(#lg)"/><rect x="14" y="36" width="8" height="12" rx="4" fill="#fff" fill-opacity=".55"/><rect x="26" y="28" width="8" height="20" rx="4" fill="#fff" fill-opacity=".75"/><rect x="38" y="19" width="8" height="29" rx="4" fill="#fff"/><path ${d?'class="dr" ':''}d="M10 40l12-9 9 5 13-16 10-5" fill="none" stroke="#fbbf24" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/><circle ${d?'class="pt" ':''}cx="54" cy="15" r="3.6" fill="#fbbf24"/></svg>`;
const CT={Food:'🍛',Groceries:'🛒',Rent:'🏠',Bills:'💡',Travel:'🚕',Shopping:'🛍️',Health:'💊',Education:'📚',Salary:'💼',Business:'🏪',Investment:'📈',Other:'✨'};
const $=s=>document.querySelector(s),inr=n=>(n<0?'-':'')+'₹'+Math.abs(+n||0).toLocaleString('en-IN',{maximumFractionDigits:0}),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),td=()=>new Date().toISOString().slice(0,10);
let S,P,tab='home',mo=td().slice(0,7),ei=-1,mty='out';
const ld=p=>{try{return JSON.parse(localStorage.getItem('pp_'+p))}catch(e){return null}};
const sv=()=>{try{localStorage.setItem('pp_'+P,JSON.stringify(S))}catch(e){toast('Storage full — download a backup')}};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
const sum=(a,t)=>a.filter(x=>x.type==t).reduce((s,x)=>s+x.amt,0);
function login(p,pin){const d=ld(p);if(d&&d.pin&&d.pin!==pin)return toast('Wrong PIN');
 S=d||{tx:[],goals:[],ledgers:['Cash','Bank','UPI','Card'],bud:{},rec:[],assets:[],mkt:'',pin:'',theme:''};P=p;["ud","hd","bl","ln","iv"].forEach(k=>S[k]=S[k]||[]);
 try{localStorage.setItem('pp_last',p)}catch(e){}
 document.documentElement.dataset.theme=S.theme||'';setTimeout(()=>{const d=S.bl.filter(b=>dl(b)<=3);if(d.length)toast('🔔 '+d.length+' bill(s) due within 3 days')},900);
 const n=new Date(),m=td().slice(0,7);let a=0;S.rec.forEach(r=>{if((r.last||'')<m&&n.getDate()>=r.day){S.tx.push({type:r.type,amt:r.amt,ds:r.ds+' (auto)',cat:r.cat,lg:r.lg,date:m+'-'+String(r.day).padStart(2,'0')});r.last=m;a++}});
 if(a){sv();toast(a+' recurring entries added')}render()}
function render(){
 if(!P){$('#app').innerHTML=`<div class="login">${LG(96)}<h1 style="font-size:34px;letter-spacing:-1px">Paisa Pulse</h1><div class="mu">Track every rupee · Grow every goal</div><div>${['Ledgers','UPI & bank import','Budgets','Goals','Net worth','Market pulse','SIP/EMI/FD tools'].map(x=>`<span class="chip">${x}</span>`).join('')}</div>
 <div class="cd" style="width:100%;max-width:350px"><div class="mu" style="text-align:left">Mobile number</div><input id="ph" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile" style="width:100%;margin:6px 0"><input id="pn" type="password" inputmode="numeric" maxlength="4" placeholder="PIN (only if you set one)" style="width:100%;margin-bottom:8px"><button onclick="go()" style="width:100%">Continue →</button></div></div>${ft()}`;return}
 $('#app').innerHTML=`<div class="r sb"><div class="r">${LG(38)}<div><h3>Paisa Pulse</h3><div class="mu">+91 ${P}</div></div></div></div>${{home,ledger,me,plan,wealth,more}[tab]()}${ft()}
 <button class="fab" onclick="openTx(-1)" aria-label="Add">＋</button>
 <nav>${[['home','🏠','Home'],['ledger','📒','Ledger'],['me','🧭','Me'],['plan','🎯','Plan'],['wealth','📈','Wealth'],['more','⚙️','More']].map(x=>`<button class="${tab==x[0]?'on':''}" onclick="tab='${x[0]}';render();scrollTo(0,0)"><i>${x[1]}</i>${T(x[2],x[2])}</button>`).join('')}</nav>`;if(tab=='ledger')tbl()}
const ft=()=>'<footer>Made with ❤️ by Sudipta Chatterjee · Seenvoy Media</footer>';
function go(){const p=$('#ph').value.replace(/\D/g,'');if(!/^[6-9]\d{9}$/.test(p))return toast('Enter a valid mobile number');login(p,$('#pn').value)}
const mm=m=>S.tx.filter(x=>x.date.startsWith(m));
const prev=(m,k)=>{const d=new Date(m+'-01');d.setMonth(d.getMonth()+k);return d.toISOString().slice(0,7)};
const mname=m=>new Date(m+'-01').toLocaleString('en-IN',{month:'short',year:'2-digit'});
function health(m){const t=mm(m),i=sum(t,'in'),o=sum(t,'out'),sr=i?(i-o)/i:0;const bs=Object.entries(S.bud);const ok=bs.length?bs.filter(([c,v])=>t.filter(x=>x.cat==c&&x.type=='out').reduce((s,x)=>s+x.amt,0)<=v).length/bs.length:.5;
 return Math.round(Math.max(0,Math.min(40,sr*100*1.6))+ok*25+Math.min(20,t.length*2)+(S.goals.length?15:0))}
function home(){const t=mm(mo),i=sum(t,'in'),o=sum(t,'out'),all=sum(S.tx,'in')-sum(S.tx,'out'),by={};
 t.filter(x=>x.type=='out').forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amt);const top=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 const cols=['#0f766e','#14b8a6','#f59e0b','#e11d48','#6366f1','#84cc16'];let acc=0;const grad=top.slice(0,6).map(([c,v],k)=>{const s=acc;acc+=v/o*100;return `${cols[k]} ${s}% ${acc}%`}).join(',');
 const ms=[5,4,3,2,1,0].map(k=>prev(mo,-k)),vals=ms.map(m=>sum(mm(m),'out')),mx=Math.max(...vals,1),sc=health(mo);
 const dim=new Date(+mo.slice(0,4),+mo.slice(5),0).getDate(),dn=mo==td().slice(0,7)?new Date().getDate():dim,proj=o/dn*dim;
 const lp=sum(mm(prev(mo,-1)),'out'),ins=[];if(top[0])ins.push(`💡 ${top[0][0]} is your biggest spend (${Math.round(top[0][1]/o*100)}%).`);
 if(lp&&o)ins.push(o>lp?`⚠️ Spending is ${Math.round((o/lp-1)*100)}% above last month.`:`🎉 Spending is ${Math.round((1-o/lp)*100)}% below last month.`);
 if(o&&mo==td().slice(0,7))ins.push(`🔮 Projected month-end spend: ${inr(proj)}.`);
 return `<div class="hero"><div class="r sb"><span class="mu">${T('nb','Net balance')}</span><span class="r"><button class="x" style="background:rgba(255,255,255,.2)" onclick="mo=prev(mo,-1);render()">‹</button><b>${mname(mo)}</b><button class="x" style="background:rgba(255,255,255,.2)" onclick="mo=prev(mo,1);render()">›</button></span></div><h1>${inr(all)}</h1>
 <div class="g3" style="margin-top:10px"><div class="k"><span class="mu">${T('inc','Income')}</span><b>${inr(i)}</b></div><div class="k"><span class="mu">${T('exp','Expense')}</span><b>${inr(o)}</b></div><div class="k"><span class="mu">${T('sv','Saved')}</span><b>${i?Math.round((i-o)/i*100):0}%</b></div></div></div>
 <div class="cd r"><div class="ring" style="background:conic-gradient(${sc>66?'var(--ok)':sc>40?'var(--ac)':'var(--bad)'} ${sc*3.6}deg,var(--bd) 0)"><div>${sc}</div></div><div class="fl"><h3>Money health score</h3><div class="mu">Savings rate, budget discipline, tracking habit and goals.</div></div></div>
 ${habit()}${ins.length?`<div class="cd">${ins.map(x=>`<div style="padding:3px 0">${x}</div>`).join('')}</div>`:''}
 <div class="cd"><h3>Where money goes</h3>${top.length?`<div class="r" style="margin-top:10px"><div class="dn" style="background:conic-gradient(${grad})"><div>${inr(o)}<br>spent</div></div><div class="fl">${top.slice(0,5).map(([c,v],k)=>`<div class="r sb" style="font-size:13px"><span><span style="color:${cols[k]}">●</span> ${CT[c]||''} ${c}</span><b>${inr(v)}</b></div>`).join('')}</div></div>`:'<div class="mu" style="margin-top:6px">No spends yet. Tap ＋ to add.</div>'}</div>
 <div class="cd"><h3>6-month spending</h3><div class="bars" style="margin-top:10px">${ms.map((m,k)=>`<div><span style="height:${vals[k]/mx*80}px"></span>${mname(m).split(' ')[0]}</div>`).join('')}</div></div>
 <div class="cd"><h3>${T('rc','Recent')}</h3>${S.tx.map((x,i)=>({...x,i})).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(row).join('')||'<div class="mu">Nothing yet.</div>'}</div>`}
const row=x=>`<div class="li" onclick="openTx(${x.i})"><div class="ic">${CT[x.cat]||'✨'}</div><div class="fl"><div>${esc(x.ds)}</div><div class="mu">${x.date} · ${esc(x.lg)} · ${esc(x.cat)}${x.img?' · 📎':''}${x.tg?' · '+esc(x.tg):''}</div></div><b class="${x.type}">${x.type=='in'?'+':'-'}${inr(x.amt)}</b></div>`;
function ledger(){return `<div class="r" style="margin-top:12px"><input id="q" placeholder="🔍 Search" oninput="tbl()"><select id="fl" onchange="tbl()"><option value="">All ledgers</option>${S.ledgers.map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="ft" onchange="tbl()"><option value="">All</option><option value="in">Income</option><option value="out">Expense</option></select></div><div class="cd" id="tb"></div>`}
function tbl(){const q=($('#q').value||'').toLowerCase(),f=$('#fl').value,t=$('#ft').value;const L=S.tx.map((x,i)=>({...x,i})).filter(x=>(!f||x.lg==f)&&(!t||x.type==t)&&(x.ds+x.cat+(x.tg||'')+(x.nt||'')).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));
 const i=sum(L,'in'),o=sum(L,'out');$('#tb').innerHTML=`<div class="r sb mu"><span>${L.length} entries</span><span>In <b class="in">${inr(i)}</b> · Out <b class="out">${inr(o)}</b> · Bal <b>${inr(i-o)}</b></span></div>`+(L.slice(0,150).map(row).join('')||'<div class="mu">No entries</div>')}
function openTx(i){ei=i;const x=i>=0?S.tx[i]:{type:'out',amt:'',ds:'',cat:'Food',lg:S.ledgers[0],date:td()};mty=x.type;
 $('#md').innerHTML=`<div class="md" onclick="if(event.target==this)cl()"><div class="sh"><div class="seg"><button id="bo" class="${mty=='out'?'on':''}" onclick="sty('out')">Expense</button><button id="bi" class="${mty=='in'?'on':''}" onclick="sty('in')">Income</button></div>
 <div class="r"><input id="am" type="number" inputmode="decimal" placeholder="Amount ₹" value="${x.amt}" style="font-size:22px;font-weight:700"><input id="ds" placeholder="What / who? (e.g. Milk, Rent)" value="${esc(x.ds)}"><select id="ct">${Object.keys(CT).map(c=>`<option ${c==x.cat?'selected':''}>${c}</option>`).join('')}</select><select id="lg">${S.ledgers.map(c=>`<option ${c==x.lg?'selected':''}>${esc(c)}</option>`).join('')}</select><input id="dt" type="date" value="${x.date}"></div><div class="r" style="margin-top:8px"><input id="tg" placeholder="Tags (#office #trip)" value="${esc(x.tg||'')}"><input id="nt" placeholder="Note" value="${esc(x.nt||'')}"><input id="im" type="file" accept="image/*"></div>${x.img?`<img src="${x.img}" alt="receipt" style="max-width:100%;border-radius:12px;margin-top:8px">`:''}
 <label class="mu r" style="margin-top:8px"><input type="checkbox" id="rc" style="flex:none"> Repeat every month</label>
 <div class="r" style="margin-top:12px"><button onclick="saveTx()" style="flex:1">${i>=0?'Update':'Save'}</button>${i>=0?'<button class="s" onclick="S.tx.splice(ei,1);sv();cl();render()">Delete</button>':''}</div></div></div>`}
const sty=t=>{mty=t;$('#bo').className=t=='out'?'on':'';$('#bi').className=t=='in'?'on':''},cl=()=>$('#md').innerHTML='';
async function saveTx(){const a=+$('#am').value;if(!a)return toast('Enter amount');const x={type:mty,amt:a,ds:$('#ds').value||'—',cat:$('#ct').value,lg:$('#lg').value,date:$('#dt').value,tg:$('#tg').value,nt:$('#nt').value,img:ei>=0?S.tx[ei].img:''};const fi=$('#im').files[0];if(fi)x.img=await shrink(fi);
 if(ei>=0)S.tx[ei]=x;else S.tx.push(x);if($('#rc').checked)S.rec.push({type:x.type,amt:a,ds:x.ds,cat:x.cat,lg:x.lg,day:+x.date.slice(8)||1,last:x.date.slice(0,7)});sv();cl();render();toast('Saved ✅')}
const TR={bn:{Home:'হোম',Ledger:'খাতা',Me:'আমি',Plan:'পরিকল্পনা',Wealth:'সম্পদ',More:'আরও',nb:'মোট ব্যালেন্স',inc:'আয়',exp:'খরচ',sv:'সঞ্চয়',rc:'সাম্প্রতিক'},hi:{Home:'होम',Ledger:'खाता',Me:'मैं',Plan:'योजना',Wealth:'धन',More:'और',nb:'कुल बैलेंस',inc:'आय',exp:'खर्च',sv:'बचत',rc:'हाल का'}};

function mkGoals(){if(!PL)return;const add=(n,t,sv_)=>{if(!S.goals.some(g=>g.name==n))S.goals.push({name:n,target:Math.round(t),saved:Math.round(sv_)})};add('Emergency fund',PL.ef,PL.efS);add('Retirement corpus',PL.corpus,PL.rest);sv();tab='plan';render();toast('Goals created 🎯')}
function plan(){const t=mm(mo);return `<div class="cd"><h3>🎯 Budgets · ${mname(mo)}</h3>${Object.entries(S.bud).map(([c,v])=>{const s=t.filter(x=>x.cat==c&&x.type=='out').reduce((a,x)=>a+x.amt,0),p=s/v*100;return `<div style="margin-top:10px"><div class="r sb"><span>${CT[c]||''} ${c}</span><span class="${p>100?'out':''}">${inr(s)} / ${inr(v)} <button class="s x" onclick="delete S.bud['${c}'];sv();render()">✕</button></span></div><div class="bar"><i style="width:${Math.min(100,p)}%;${p>100?'background:var(--bad)':p>80?'background:var(--ac)':''}"></i></div></div>`}).join('')||'<div class="mu">No budgets yet.</div>'}
 <div class="r" style="margin-top:12px"><select id="bc">${Object.keys(CT).map(c=>`<option>${c}</option>`).join('')}</select><input id="bv" type="number" placeholder="Monthly limit ₹"><button onclick="if(+$('#bv').value){S.bud[$('#bc').value]=+$('#bv').value;sv();render()}">Set</button></div></div>
 <div class="cd"><h3>🏆 Savings goals</h3>${S.goals.map((g,i)=>{const p=Math.min(100,g.saved/g.target*100);return `<div style="margin-top:12px"><div class="r sb"><b>${esc(g.name)}</b><span class="mu">${Math.round(p)}%</span></div><div class="bar"><i style="width:${p}%;background:linear-gradient(90deg,#f59e0b,#fbbf24)"></i></div><div class="r sb mu" style="margin-top:4px"><span>${inr(g.saved)} of ${inr(g.target)}</span><span><button class="x" onclick="addG(${i})">+ Add money</button> <button class="s x" onclick="S.goals.splice(${i},1);sv();render()">✕</button></span></div></div>`}).join('')||'<div class="mu">Dream big — add a goal.</div>'}
 <div class="r" style="margin-top:12px"><input id="gn" placeholder="Goal (Bike, Trip…)"><input id="gt" type="number" placeholder="Target ₹"><button onclick="if($('#gn').value&&+$('#gt').value){S.goals.push({name:$('#gn').value,target:+$('#gt').value,saved:0});sv();render()}">Add</button></div></div>
 <div class="cd"><h3>🔁 Recurring</h3>${S.rec.map((r,i)=>`<div class="li"><div class="fl">${esc(r.ds)}<div class="mu">Day ${r.day} · ${r.cat}</div></div><b class="${r.type}">${inr(r.amt)}</b><button class="s x" onclick="S.rec.splice(${i},1);sv();render()">✕</button></div>`).join('')||'<div class="mu">Tick “Repeat every month” when adding an entry (rent, salary, SIP).</div>'}</div>`}
function addG(i){const v=+prompt('Amount to add ₹');if(v){S.goals[i].saved+=v;sv();render()}}
function wealth(){const A=S.assets,as=A.filter(a=>a.k=='a').reduce((s,a)=>s+a.v,0)+S.hd.reduce((s,h)=>s+h.u*h.c,0),li=A.filter(a=>a.k=='l').reduce((s,a)=>s+a.v,0);
 return `<div class="hero"><span class="mu">Net worth</span><h1>${inr(as-li)}</h1><div class="g2" style="margin-top:8px"><div class="k"><span class="mu">Assets</span><b>${inr(as)}</b></div><div class="k"><span class="mu">Liabilities</span><b>${inr(li)}</b></div></div></div>
 <div class="cd">${A.map((a,i)=>`<div class="li"><div class="fl">${esc(a.n)}<div class="mu">${a.k=='a'?'Asset':'Liability'}</div></div><b class="${a.k=='a'?'in':'out'}">${inr(a.v)}</b><button class="s x" onclick="S.assets.splice(${i},1);sv();render()">✕</button></div>`).join('')||'<div class="mu">Add FD, mutual funds, stocks, gold, loans…</div>'}
 <div class="r" style="margin-top:10px"><input id="an" placeholder="Name (HDFC FD, Nifty ETF)"><input id="av" type="number" placeholder="Value ₹"><select id="ak"><option value="a">Asset</option><option value="l">Loan</option></select><button onclick="if($('#an').value&&+$('#av').value){S.assets.push({n:$('#an').value,v:+$('#av').value,k:$('#ak').value});sv();render()}">Add</button></div></div>
 <div class="cd"><h3>📡 Market pulse</h3><div class="snap"><b>Nifty 50 · 22,555.75</b> <span class="in">+0.60%</span><div class="mu">India VIX 14.67 · close of 5 Oct 2026 (verified snapshot, Capital Market)</div></div><div class="mu" style="margin-top:8px">Nifty, top mutual funds and FD rates via Claude. Indicative, not a live exchange feed — verify before investing.</div><div class="r" style="margin-top:8px"><button onclick="pulse()">Refresh snapshot</button></div><pre id="mk">${esc(S.mkt)||'Tap refresh.'}</pre></div>
 <div class="cd"><h3>🧮 Calculators</h3><div class="seg" style="margin-top:8px">${['SIP','FD','EMI'].map((k,i)=>`<button id="t${k}" class="${i?'':'on'}" onclick="ck='${k}';calc()">${k}</button>`).join('')}</div><div class="r"><input id="c1" type="number" placeholder="Amount ₹" oninput="calc()"><input id="c2" type="number" placeholder="Rate % p.a." oninput="calc()"><input id="c3" type="number" placeholder="Years" oninput="calc()"></div><div id="cr" style="margin-top:10px"></div></div>`}
let ck='SIP';
function calc(){['SIP','FD','EMI'].forEach(k=>{const b=$('#t'+k);if(b)b.className=k==ck?'on':''});const p=+$('#c1').value,R=+$('#c2').value,y=+$('#c3').value;if(!p||!R||!y)return $('#cr').innerHTML='<span class="mu">Enter values above.</span>';const r=R/1200,n=y*12;let h;
 if(ck=='SIP'){const f=p*((Math.pow(1+r,n)-1)/r)*(1+r);h=`Invested ${inr(p*n)} → <b class="in">${inr(f)}</b> (gain ${inr(f-p*n)})`}
 else if(ck=='FD'){const f=p*Math.pow(1+R/400,4*y);h=`Maturity <b class="in">${inr(f)}</b> (interest ${inr(f-p)}, quarterly compounding)`}
 else{const e=p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);h=`EMI <b>${inr(e)}</b>/month · total ${inr(e*n)} · interest <span class="out">${inr(e*n-p)}</span>`}$('#cr').innerHTML=h}
async function pulse(){const el=$('#mk');el.textContent='Fetching…';try{const s=typeof claude=='undefined'?null:await claude.use('sample');if(!s){el.textContent='Not available here. Use NSE/AMFI or your broker app.';return}
 const r=await s('Short plain-text snapshot for an Indian retail investor: approximate Nifty 50 level and trend, 5 well-known top mutual funds with approx 3Y returns, typical FD rates at SBI, HDFC, post office. Say figures are approximate and may be dated. Under 150 words.',{cache:false});S.mkt=r.text+'\n\n(Updated '+new Date().toLocaleString('en-IN')+')';sv();el.textContent=S.mkt}catch(e){el.textContent='Could not fetch ('+(e.code||'error')+').'}}
function settings(){return `<div class="cd"><h3>📥 Import statement / UPI</h3><p class="mu">Upload a CSV from your bank, GPay, PhonePe or Paytm. Columns are auto-detected; categories are guessed. Data stays on your device.</p><div class="r"><select id="il">${S.ledgers.map(c=>`<option>${esc(c)}</option>`).join('')}</select><input type="file" id="fi" accept=".csv,.txt"><button onclick="doImp()">Import</button></div>
 <textarea id="sm" rows="2" style="width:100%;margin-top:10px" placeholder="Or paste a UPI/bank SMS: Rs 250 debited to SWIGGY…"></textarea><button onclick="doSms()" style="margin-top:6px">Add from SMS</button></div>
 <div class="cd"><h3>📒 Ledgers</h3><div class="mu">${S.ledgers.map(esc).join(' · ')}</div><div class="r" style="margin-top:8px"><input id="nl" placeholder="New ledger (Shop, Savings A/c)"><button onclick="if($('#nl').value){S.ledgers.push($('#nl').value);sv();render()}">Add</button></div></div>
 <div class="cd"><h3>🌐 Language &amp; backup</h3><div class="r"><select onchange="S.lang=this.value;sv();render()"><option value="">English</option><option value="bn" ${S.lang=='bn'?'selected':''}>বাংলা</option><option value="hi" ${S.lang=='hi'?'selected':''}>हिन्दी</option></select><button class="s" onclick="dwn('paisa-pulse-backup-'+P+'.json',JSON.stringify(S))">⬇ Full backup (JSON)</button></div><div class="r" style="margin-top:8px"><input type="file" id="rs" accept=".json"><button onclick="restore()">Restore</button></div><div class="mu">Backup includes receipts and everything. Restore replaces current data.</div></div><div class="cd"><h3>🔒 Settings</h3><div class="r"><input id="np" type="password" inputmode="numeric" maxlength="4" placeholder="Set 4-digit PIN"><button onclick="S.pin=$('#np').value;sv();toast(S.pin?'PIN set':'PIN removed')">Save PIN</button></div>
 <div class="r" style="margin-top:8px"><button class="s" onclick="S.theme=S.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;sv()">🌓 Theme</button><button class="s" onclick="exp()">⬇ Backup (CSV)</button><button class="s" onclick="P=null;S=null;render()">Log out</button></div><p class="mu">Install: browser menu → Add to Home Screen. Data is stored per mobile number on this device.</p></div>`}
const sp=l=>{const r=[];let c='',q=0;for(const h of l){if(h=='"')q=!q;else if(h==','&&!q){r.push(c);c=''}else c+=h}r.push(c);return r.map(x=>x.trim())};
const pd=s=>{const m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(m)return`${m[3].length==2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;const d=new Date(s);return isNaN(d)?td():d.toISOString().slice(0,10)};
const gs=d=>{d=d.toLowerCase();return/swiggy|zomato|food|restaurant|cafe/.test(d)?'Food':/bigbasket|grocer|mart|blinkit|zepto/.test(d)?'Groceries':/uber|ola|irctc|metro|fuel|petrol/.test(d)?'Travel':/amazon|flipkart|myntra/.test(d)?'Shopping':/electric|recharge|jio|airtel|bill/.test(d)?'Bills':/salary/.test(d)?'Salary':/pharma|hospital|clinic/.test(d)?'Health':/sip|mutual|zerodha|groww/.test(d)?'Investment':'Other'};
function doImp(){const f=$('#fi').files[0];if(!f)return toast('Choose a CSV');const r=new FileReader();r.onload=()=>{const L=r.result.split(/\r?\n/).filter(x=>x.trim());let hi=L.findIndex(l=>/date/i.test(l)&&/(desc|narr|particular|detail|remark)/i.test(l));if(hi<0)hi=0;const h=sp(L[hi]).map(x=>x.toLowerCase()),ix=e=>h.findIndex(x=>e.test(x)),D=ix(/date/),N=ix(/desc|narr|particular|detail|remark/),W=ix(/debit|withdraw|paid/),C=ix(/credit|deposit|received/),A=ix(/^amount/),nm=v=>parseFloat(String(v||'').replace(/[₹,\s]/g,''))||0;let n=0,sk=0;const seen=new Set(S.tx.map(x=>x.date+'|'+x.amt+'|'+x.type+'|'+x.ds));
 for(const l of L.slice(hi+1)){const c=sp(l);if(D<0||!c[D])continue;let t,a;if(W>=0&&nm(c[W])>0){t='out';a=nm(c[W])}else if(C>=0&&nm(c[C])>0){t='in';a=nm(c[C])}else if(A>=0&&nm(c[A])){a=Math.abs(nm(c[A]));t=nm(c[A])<0||/dr/i.test(l)?'out':'in'}else continue;const ds=c[N>=0?N:1]||'Imported';const nx={type:t,amt:a,ds,cat:gs(ds),lg:$('#il').value,date:pd(c[D])},k=nx.date+'|'+nx.amt+'|'+nx.type+'|'+nx.ds;if(seen.has(k)){sk++;continue}seen.add(k);S.tx.push(nx);n++}
 sv();toast(n?`Imported ${n} ✅ (${sk} duplicates skipped)`:sk?`${sk} duplicates skipped`:'No rows recognised');if(n)render()};r.readAsText(f)}
function doSms(){const t=$('#sm').value,m=t.match(/(?:rs\.?|inr|₹)\s*([\d,]+(?:\.\d+)?)/i);if(!m)return toast('Amount not found');const to=(t.match(/(?:to|at|from)\s+([A-Za-z0-9 @._-]{3,30})/i)||[])[1]||'UPI';S.tx.push({type:/credited|received/i.test(t)?'in':'out',amt:parseFloat(m[1].replace(/,/g,'')),ds:to.trim(),cat:gs(t),lg:'UPI',date:td()});sv();$('#sm').value='';toast('Added ✅')}
async function exp(){const csv='Date,Type,Ledger,Category,Description,Amount\n'+S.tx.map(x=>[x.date,x.type,x.lg,x.cat,'"'+x.ds.replace(/"/g,'""')+'"',x.amt].join(',')).join('\n');try{const d=await claude.use('downloads');if(d){await d.save({filename:'paisa-pulse-'+P+'.csv',data:csv});return}}catch(e){}try{await navigator.clipboard.writeText(csv);toast('CSV copied')}catch(e){toast('Export unavailable')}}
{const sp=$('#sp');sp.innerHTML=sp.innerHTML.replace('${SPL}',LG(104,1));setTimeout(()=>sp.classList.add('hd'),2600);setTimeout(()=>sp.remove(),3300);const ic=document.createElement('link');ic.rel='icon';ic.href='data:image/svg+xml,'+encodeURIComponent(LG(64).replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '));document.head.appendChild(ic)}
